name: caldero_app
description: "Cuentos originales con enseñanza, narrados y animados."
publish_to: 'none'
version: 0.9.0+18

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  caldero_engine:
    path: ../packages/caldero_engine
  caldero_rig:
    path: ../packages/caldero_rig
  http: ^1.2.0
  shared_preferences: ^2.3.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  wakelock_plus: ^1.8.1
  share_plus: ^13.3.1
  screen_brightness: ^2.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Copias de content/packs/*; las sincroniza tools/sync_assets.sh y las verifica CI.
    - assets/packs/demo/
    - assets/packs/medieval/
    # Política de privacidad y términos de uso (los sincroniza tools/sync_assets.sh desde content/legal/).
    - assets/legal/
    # Guía en PDF (la genera tools/guide/make_holograma_pdf.py)
    - assets/guides/
    # Arte generado por código (art/): lo sincroniza tools/sync_assets.sh y lo verifica CI.
    - assets/art/medieval/index.json
    - assets/art/medieval/rigs/
    - assets/art/medieval/scenes/
    - assets/art/clips/
    # Sonido de fondo sintetizado por tools/audio/make_ambient.py.
    - assets/audio/
    - assets/audio/sfx/
