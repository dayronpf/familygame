name: caldero_app
description: "Cuentos originales con enseñanza, narrados y animados."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  caldero_engine:
    path: ../packages/caldero_engine
  caldero_rig:
    path: ../packages/caldero_rig
  http: ^1.2.0
  shared_preferences: ^2.3.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  wakelock_plus: ^1.8.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Copias de content/packs/*; las sincroniza tools/sync_assets.sh y las verifica CI.
    - assets/packs/demo/
    - assets/packs/medieval/
    # Arte generado por código (art/): lo sincroniza tools/sync_assets.sh y lo verifica CI.
    - assets/art/medieval/index.json
    - assets/art/medieval/rigs/
    - assets/art/medieval/scenes/
    - assets/art/clips/
    # Sonido de fondo sintetizado por tools/audio/make_ambient.py.
    - assets/audio/
