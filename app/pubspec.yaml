name: caldero_app
description: "Cuentos originales con enseñanza, narrados y animados."
publish_to: 'none'
version: 1.0.0+25

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  caldero_engine:
    path: ../packages/caldero_engine
  caldero_rig:
    path: ../packages/caldero_rig
  http: ^1.2.0
  crypto: ^3.0.6  # huellas sha256 del contenido remoto (docs/34)
  shared_preferences: ^2.3.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  wakelock_plus: ^1.8.1
  share_plus: ^13.3.1
  screen_brightness: ^2.1.11
  flutter_local_notifications: ^22.0.0  # la 23 exige Android SDK 37
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5
  in_app_purchase_storekit: ^0.4.17
  url_launcher: ^6.3.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Copias de content/packs/*; las sincroniza tools/sync_assets.sh y las verifica CI.
    - assets/packs/demo/
    - assets/packs/medieval/
    - assets/packs/mar/
    - assets/packs/cosmos/
    # Catálogo fijo de cuentos (copia de content/catalogo; lo sincroniza tools/sync_assets.sh).
    - assets/catalogo/
    # Voz grabada (docs/31, A6): el manifiesto y el audio de los cuentos gratis. Los escribe
    # tools/voice/export_app.py; el resto del audio se descarga del servidor.
    - assets/voz/es/
    - assets/voz/es/audio/
    # Política de privacidad y términos de uso (los sincroniza tools/sync_assets.sh desde content/legal/).
    - assets/legal/
    # Guía en PDF (la genera tools/guide/make_holograma_pdf.py)
    - assets/guides/
    # Arte generado por código (art/): lo sincroniza tools/sync_assets.sh y lo verifica CI.
    - assets/art/medieval/index.json
    - assets/art/medieval/rigs/
    - assets/art/medieval/scenes/
    - assets/art/mar/index.json
    - assets/art/mar/rigs/
    - assets/art/mar/scenes/
    - assets/art/cosmos/index.json
    - assets/art/cosmos/rigs/
    - assets/art/cosmos/scenes/
    - assets/art/clips/
    # Sonido de fondo sintetizado por tools/audio/make_ambient.py.
    - assets/audio/
    - assets/audio/sfx/
