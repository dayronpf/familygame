name: Android (emulador)

# Arranca la app REAL en un emulador de Android y recorre lo básico (bienvenida, asistente, inicio, ajustes de adultos,
# política de privacidad y un cuento): lo que los tests de widgets no pueden comprobar (plugins de audio y voz, datos
# guardados, assets empaquetados). Deja capturas y el registro del teléfono como artefactos.
# Se ejecuta SOLO: a mano (Actions → «Android (emulador)» → Run workflow) o cambiando app/BUILD_EMU.txt en la rama de trabajo.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['app/BUILD_EMU.txt']

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  emulador:
    name: Probar en emulador
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Activar KVM (emulador rápido)
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prueba de integración en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: app
          script: |
            adb logcat -c
            flutter test integration_test/app_test.dart -d emulator-5554 || (adb logcat -d -t 800 > ../logcat-fallo.txt; exit 1)
            adb logcat -d -t 800 > ../logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulador-resultados
          path: |
            logcat.txt
            logcat-fallo.txt
          retention-days: 14
          if-no-files-found: ignore
