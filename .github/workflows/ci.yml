name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  content:
    name: Contenido (esquema, lint, sincronía de assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - name: Esquema JSON de los packs
        run: python3 tools/validate_schema.py content/packs/*/pack.json
      - name: Lint del prototipo (referencia)
        run: python3 tools/prototype/caldero.py --pack content/packs/demo --lint
      - name: Assets de la app sincronizados con content/
        run: tools/sync_assets.sh --check

  art:
    name: Arte generado (reproducible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerar personajes, clips, escena y datos de referencia
        run: |
          cd tools/art
          python3 medieval_kit.py
          python3 make_clips.py
          python3 scene_castle.py
          python3 make_fixtures.py
      - name: Lo generado coincide con lo versionado
        run: git diff --exit-code art/medieval/rigs art/medieval/scenes art/medieval/index.json art/clips art/fixtures art/medieval/preview/sheet.svg art/medieval/preview/scene_castle.svg

  feedback:
    name: Valoraciones (análisis y contrato)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy jsonschema pyyaml
      - name: Pruebas del análisis y del contrato de la API
        run: cd tools/feedback && python3 -m unittest test_analyze test_contract
      - name: La simulación se ejecuta
        run: python3 tools/feedback/simulate.py --quick

  rig:
    name: Rigs y animación (Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/caldero_rig
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - name: Pruebas (incluye la paridad numérica con Python)
        run: dart test

  engine:
    name: Motor (Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/caldero_engine
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - name: Validar packs
        run: dart run caldero_engine:validate_pack ../../content/packs/*/pack.json

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
