name: Android (APK de prueba)

# Se ejecuta a mano (Actions → «Android (APK de prueba)» → Run workflow) o al publicar una etiqueta v*.
# El APK sale firmado con la llave de DEPURACIÓN: sirve para instalar y probar, NO para publicar en Play Store.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Pruebas antes de compilar
        run: flutter test
      - name: APK release (un solo archivo para cualquier teléfono)
        run: flutter build apk --release
      - name: Resumen
        run: |
          ls -lh build/app/outputs/flutter-apk/
          echo "### APK compilado" >> "$GITHUB_STEP_SUMMARY"
          echo "Tamaño: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: caldero-de-cuentos-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
