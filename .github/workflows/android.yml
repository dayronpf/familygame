name: Android (APK de prueba)

# Se ejecuta SOLO: a mano (Actions → «Android (APK de prueba)» → Run workflow) o al publicar una etiqueta v*.
# Ya no compila en cada subida a la rama: el dueño del producto prefiere recibir un APK solo cuando la calidad
# de los cuentos esté lista para probar (se lanza a mano en ese momento).
# El APK sale firmado con una llave de PRUEBA fija (app/android/app/caldero-debug.p12, pública): sirve para instalar y
# actualizar encima de la versión anterior, NO para publicar en Play Store.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # para publicar el APK en la release fija «apk-latest»

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Pruebas antes de compilar
        run: flutter test
      - name: APK release (un solo archivo para cualquier teléfono)
        run: flutter build apk --release
      - name: Resumen
        run: |
          ls -lh build/app/outputs/flutter-apk/
          echo "### APK compilado" >> "$GITHUB_STEP_SUMMARY"
          echo "Tamaño: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar el APK suelto (enlace directo, sin zip)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk caldero-de-cuentos.apk
          # Release fija: siempre tiene el APK más reciente, con la misma URL.
          gh release delete apk-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create apk-latest caldero-de-cuentos.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "APK de prueba (el más reciente)" \
            --notes "Compilado desde ${GITHUB_SHA::7} (${GITHUB_REF_NAME}). Firmado con la llave de prueba fija: se instala encima del anterior. NO es para las tiendas."
          echo "### Descarga directa" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/apk-latest/caldero-de-cuentos.apk" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: caldero-de-cuentos-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
